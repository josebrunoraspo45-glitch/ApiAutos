<!DOCTYPE html>
<html lang="es">
<head>

    <title>Gestión de Autos</title>

<body>
    <h1>Gestion de Autos</h1>

<details id="panelRegistro">
    <summary>Registrar nuevo auto</summary>
    <form id="formAuto">
        <label for="marca">Marca</label>
        <inputtype="text" id="modelo" required minlength="2">

        <label for="anio">Año</label>
        <input type="number" id="anio" required>

        <label for="patente">Patente</label>
        <input type="text" id="patente" required>

        <label for="km">Km</label>
        <input type="number" id="km" required min="0">

        <label for="fechaIngreso">Fecha de ingreso</label>
        <input type="text" id="fechaIngreso"  required>

        <label for="disponible">Disponible</label>
        <select id="disponible" required>
            <option value="">Seleccionar</option>
            <option value="true">Si</option>
            <option value="false">No</option>
        </select>

        <button type="submit">Guardar</button>
    </form>
    
</details>
