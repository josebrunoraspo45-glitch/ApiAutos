<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>AutoRush</title>
</head>
<body>
    <div class="titulo">
        <h1>AUTORUSH</h1>
        <img src="img/Screenshot_20260930_155340_Photos.png" alt="Logo de Gestión de Autos" class="logo">
    </div>

<div id="carruselPortada" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="img/auto1.jpg" class="d-block w-100" alt="Auto en exhibición">
        </div>
        <div class="carousel-item">
            <img src="img/auto2.jpg" class="d-block w-100" alt="Auto en la ruta">
        </div>
        <div class="carousel-item">
            <img src="img/auto3.jpg" class="d-block w-100" alt="Detalle de un auto">
        </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carruselPortada" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carruselPortada" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
    </button>
</div>

    <h2>Gestion de Autos</h2>

<details id="panelRegistro">
    <summary>Registrar nuevo auto</summary>
    <form id="formAuto">
    <div class="campo">
        <label for="marca">Marca</label>
        <input type="text" id="marca" required>
    </div>

    <div class="campo">
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" required minlength="2">
    </div>
    <div class="campo">   
        <label for="anio">Año</label>
        <input type="number" id="anio" required>
    </div>
    <div class="campo">
        <label for="patente">Patente</label>
        <input type="text" id="patente" required>
    </div>
    <div class="campo">
        <label for="km">Km</label>
        <input type="number" id="km" required min="0">
    </div>
    <div class="campo">
        <label for="fechaIngreso">Fecha de ingreso</label>
        <input type="date" id="fechaIngreso"  required>
    </div>
    <div class="campo">
        <label for="disponible">Disponible</label>
        <select id="disponible" required>
            <option value="">Seleccionar</option>
            <option value="true">Si</option>
            <option value="false">No</option>
        </select>
    </div>
    <div class="botones">
        <button type="submit" class="btn-guardar">Guardar</button>
        <button type="button" class="btn-cancelar" onclick="cancelarEdicion()">Cancelar</button>
    </div>
    </form>
    
</details>
<p id="mensaje"></p>


    <h2>Autos Registrados</h2>
<div class="tabla-contenedor">
    <table>
        <thead>
            <tr> 
                <th>Marca</th>
                <th>Modelo</th>
                <th>Año</th>
                <th>Patente</th>
                <th>Km</th>
                <th>Fecha de ingreso</th>
                <th>Disponible</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaAutos"></tbody>
    </table>
</div>

<section class="marcas">
    <div class="marcas-pista">
        <img src="img/Toyota.png" alt="Toyota">
        <img src="img/Ford.png"Ford">
        <img src="img/Chevrolet.png" alt="Chevrolet">
        <img src="img/Volkswagen.png" alt="Volkswagen">
        <img src="img/Fiat.png" alt="Fiat">
        <img src="img/Renault.png" alt="Renault">
        <img src="img/Peugeot.png" alt="Peugeot">
        <img src="img/Mercedes.png" alt="Mercedes">

        <img src="img/Toyota.png" alt="Toyota">
        <img src="img/Ford.png"Ford">
        <img src="img/Chevrolet.png" alt="Chevrolet">
        <img src="img/Volkswagen.png" alt="Volkswagen">
        <img src="img/Fiat.png" alt="Fiat">
        <img src="img/Renault.png" alt="Renault">
        <img src="img/Peugeot.png" alt="Peugeot">
        <img src="img/Mercedes.png" alt="Mercedes">
    </div>
</section>

<footer>
        <p>Gestora AutoRush </p>
        <p>Copyright © 2026 All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
